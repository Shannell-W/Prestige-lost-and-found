<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prestige Lost &amp; Found API docs</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css">
  <style>body { margin: 0; background: #fff; } .topbar { display: none; }</style>
</head>
<body>
  <!-- Browsable docs rendered from ../openapi.yaml with Swagger UI.
       With the server running: http://localhost:5000/docs/
       On GitHub Pages (Settings -> Pages -> branch main, folder / root): https://<user>.github.io/<repo>/docs/ -->
  <div id="swagger-ui"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
  <script>
    window.ui = SwaggerUIBundle({ url: "../openapi.yaml", dom_id: "#swagger-ui", deepLinking: true });
  </script>
</body>
</html>
