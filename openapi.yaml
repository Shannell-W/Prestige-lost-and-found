openapi: 3.0.0
info:
  title: Prestige Lost & Found API
  version: 2.0.0
  description: >
    Claims, fees, refunds and school statistics from Campus Lost & Found (Team 5),
    for Team 6 (MoneyMentor Kenya). These routes have no /api prefix and need no key.
    Money amounts are whole cents (10000 = KSh 100.00). Timestamps are ISO 8601 in UTC.
    studentId is the student's own school ID (e.g. "SU-1001"); claimId and itemId are
    numbers sent as strings. Every error response has the shape {"error": "<message>"}.
    Changes since 1.0.0 are listed in CONTRACT_DEVIATIONS.md.

servers:
  - url: http://localhost:5000
    description: Local development server

components:
  parameters:
    ClaimId:
      name: claimId
      in: path
      required: true
      description: The claim's ID, e.g. "1". Anything that isn't a whole number gets 404.
      schema:
        type: string
        example: '1'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: claim not found

    ClaimStatus:
      type: string
      enum: [pending, claimed, rejected]
      description: >
        pending = waiting for the finder to decide; claimed = approved, the item was
        returned to this student; rejected = not approved.
      example: claimed

    Claim:
      type: object
      required: [claimId, studentId, itemId, status, rewardAmountCents]
      properties:
        claimId:
          type: string
          example: '1'
        studentId:
          type: string
          description: The claimant's school student ID.
          example: SU-1001
        itemId:
          type: string
          example: '1'
        status:
          $ref: '#/components/schemas/ClaimStatus'
        rewardAmountCents:
          type: integer
          description: The reward the finder set on the item, in cents.
          example: 15000

    Refund:
      type: object
      required: [refundId, claimId, studentId, amountCents, reason, refundedAt]
      properties:
        refundId:
          type: string
          example: '1'
        claimId:
          type: string
          example: '1'
        studentId:
          type: string
          example: SU-1001
        amountCents:
          type: integer
          minimum: 1
          example: 2500
        reason:
          type: string
          example: Item returned with a broken zip; partial refund issued.
        refundedAt:
          type: string
          format: date-time
          example: '2026-10-08T13:30:00Z'

  responses:
    BadRequest:
      description: A required field is missing, has the wrong type, or the body isn't valid JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: studentId is required and must be a string
    ClaimNotFound:
      description: No claim with that claimId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: claim not found

paths:
  /claims:
    get:
      summary: List claims with a given status, with each item's reward amount
      parameters:
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ClaimStatus'
      responses:
        '200':
          description: Claims with that status, oldest first. An empty list if there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Claim'
              example:
                - claimId: '1'
                  studentId: SU-1001
                  itemId: '1'
                  status: claimed
                  rewardAmountCents: 15000
        '400':
          description: status is missing or not one of pending, claimed, rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'status must be one of: pending, claimed, rejected'
    post:
      summary: Submit a claim on a found item for a student
      description: >
        The new claim is pending, and the item is marked as claimed (waiting for review).
        A student can't claim an item they found themselves, an item that was already
        returned, or the same item twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, itemId]
              properties:
                studentId:
                  type: string
                  example: SU-1001
                itemId:
                  type: string
                  example: '3'
                evidence:
                  type: string
                  description: Optional. Why the student believes the item is theirs.
                  example: My name is printed on the card.
      responses:
        '201':
          description: Claim created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
              example:
                claimId: '4'
                studentId: SU-1001
                itemId: '3'
                status: pending
                rewardAmountCents: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No student or no item with that ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: student not found
        '409':
          description: The student found this item, the item was already returned, or they already claimed it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: You have already claimed this item

  /claims/{claimId}:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    patch:
      summary: Set a claim's status
      description: >
        Sending the status a claim already has changes nothing. Setting "claimed" makes this
        student the owner: other pending claims on the item become "rejected", the item is
        marked returned, and a handling fee is recorded (see /claims/{claimId}/fees). Only one
        claim per item can be "claimed".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/ClaimStatus'
      responses:
        '200':
          description: The updated claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          description: status is missing or invalid (checked before the claim is looked up).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/ClaimNotFound'
        '409':
          description: Another claim on this item is already approved, or this claim has refunds so its approval can't be undone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Another claim on this item has already been approved
    delete:
      summary: Withdraw a claim
      description: Deletes the claim with its fee and refunds. If it was the approved claim, the item becomes available again.
      responses:
        '204':
          description: Claim deleted. No body.
        '404':
          $ref: '#/components/responses/ClaimNotFound'

  /students/{studentId}/claims:
    get:
      summary: List a student's claims with their current status
      parameters:
        - name: studentId
          in: path
          required: true
          description: The student's school student ID.
          schema:
            type: string
            example: SU-1001
      responses:
        '200':
          description: The student's claims, oldest first. An empty list if they have made none.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [claimId, itemId, status, submittedAt]
                  properties:
                    claimId:
                      type: string
                      example: '1'
                    itemId:
                      type: string
                      example: '1'
                    status:
                      $ref: '#/components/schemas/ClaimStatus'
                    submittedAt:
                      type: string
                      format: date-time
                      example: '2026-10-01T06:15:00Z'
        '404':
          description: No student with that studentId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: student not found

  /schools/{schoolId}/item-statistics:
    get:
      summary: Lost-item statistics for a school
      parameters:
        - name: schoolId
          in: path
          required: true
          description: The school's name, URL-encoded, e.g. Strathmore%20University.
          schema:
            type: string
            example: Strathmore University
      responses:
        '200':
          description: Totals calculated live from the school's items.
          content:
            application/json:
              schema:
                type: object
                required: [schoolId, schoolName, totalItemsReported, totalItemsClaimed, totalRewardAmountPaidCents]
                properties:
                  schoolId:
                    type: string
                    example: Strathmore University
                  schoolName:
                    type: string
                    example: Strathmore University
                  totalItemsReported:
                    type: integer
                    description: Every item reported found at this school.
                    example: 4
                  totalItemsClaimed:
                    type: integer
                    description: Items returned to their owner (an approved claim).
                    example: 1
                  totalRewardAmountPaidCents:
                    type: integer
                    description: Total rewards on returned items, in cents.
                    example: 15000
        '404':
          description: No student or item belongs to a school with that name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: school not found

  /claims/{claimId}/fees:
    get:
      summary: The handling fee payable on an approved claim
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Fee details for the claim.
          content:
            application/json:
              schema:
                type: object
                required: [claimId, studentId, itemId, amountPayableCents]
                properties:
                  claimId:
                    type: string
                    example: '1'
                  studentId:
                    type: string
                    example: SU-1001
                  itemId:
                    type: string
                    example: '1'
                  amountPayableCents:
                    type: integer
                    example: 10000
        '404':
          description: >
            No claim with that claimId ("claim not found"), or the claim exists but hasn't
            been approved, so no fee has been charged yet ("no fee has been charged on this claim yet").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no fee has been charged on this claim yet

  /claims/{claimId}/refunds:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    get:
      summary: List refunds on a claim (a claim can have several partial refunds)
      responses:
        '200':
          description: Refunds on the claim, oldest first. An empty list if there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Refund'
        '404':
          $ref: '#/components/responses/ClaimNotFound'
    post:
      summary: Refund part or all of a claim's handling fee
      description: The total refunded on a claim can never be more than its fee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, amountCents, reason]
              properties:
                studentId:
                  type: string
                  description: Must be the student who made the claim.
                  example: SU-1001
                amountCents:
                  type: integer
                  minimum: 1
                  example: 1000
                reason:
                  type: string
                  example: Collected late because the office was closed.
      responses:
        '201':
          description: Refund created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ClaimNotFound'
        '409':
          description: The claim has no fee, or the refund is more than what is left of the fee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: refund exceeds the remaining refundable fee of 7500 cents
